aid: tennet

name: TenneT

description: TenneT is a leading European transmission system operator (TSO) responsible for high‑voltage electricity grids in the Netherlands
  and Germany. It ensures reliable, secure power supply, drives the energy transition, and provides market platforms for electricity trading.
  The company focuses on sustainability, grid expansion, and digital innovation to support a low‑carbon future.

